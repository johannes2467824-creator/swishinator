<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09141F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mobile App Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap');
:root { --bg:#0B131E; --white:#E8F1FA; --blue:#0077D2; --muted:#263E64; }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--bg); color:var(--white); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
button,input { font:inherit; }
button { cursor:pointer; }
.screen { position:relative; width:100%; max-width:390px; height:100vh; height:100dvh; margin:auto; overflow:hidden; background:#0B131E; }
.home-logo { position:absolute; width:200px; max-width:70%; height:auto; left:50%; top:44.5%; transform:translate(-50%,-50%); mix-blend-mode:normal; opacity:1; filter:none; object-fit:contain; }
.actions { position:absolute; bottom:calc(96px + env(safe-area-inset-bottom)); left:20px; right:20px; display:flex; gap:8px; }
.action { border:none; border-radius:12px; height:55px; flex:1; color:white; font-size:19px; background:#0077D2; }
.action.scan { background:#263E64; color:#84D5FF; display:flex; justify-content:center; align-items:center; gap:14px; }
.action svg { width:26px; height:26px; }
.navbar { position:absolute; bottom:calc(17px + env(safe-area-inset-bottom)); left:20px; right:20px; border:1px solid #2B4057; background:#101B27; border-radius:40px; height:62px; display:flex; padding:3px; box-shadow:0 0 0 1px #152536; }
.tab { color:var(--white); border:none; background:none; flex:1; min-width:0; border-radius:38px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px; font-size:11px; }
.tab.active { background:#303B46; }
.tab svg { width:25px; height:25px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.tab.active svg.home-icon { fill:currentColor; }
.tab span { white-space:nowrap; }
.panel { position:absolute; inset:0 0 calc(178px + env(safe-area-inset-bottom)); padding:calc(65px + env(safe-area-inset-top)) 25px 16px; overflow:auto; background:var(--bg); }
.panel[hidden],.home-logo[hidden],.actions[hidden] { display:none; }
.panel h1 { font-size:27px; margin:0 0 12px; }
.panel p { color:#9BB0C6; line-height:1.5; }
.tile { background:#15283D; padding:18px; border-radius:16px; margin:16px 0; }
.tile h2 { font-size:18px; margin:0 0 10px; }
.field { width:100%; border:1px solid #38516D; border-radius:10px; background:#0D1D2C; color:white; padding:13px; margin:7px 0; }
.primary { border:none; background:var(--blue); color:white; border-radius:10px; padding:13px 18px; width:100%; margin-top:12px; }
.back { background:none; border:none; color:#87D0FF; padding:0 0 20px; }
.scanframe { width:180px; height:180px; border:3px solid #87D0FF; border-radius:20px; margin:35px auto; display:grid; place-items:center; color:#87D0FF; }
.scanframe svg { width:75px; height:75px; }
@media(max-height:650px) { .home-logo { width:150px; } .actions { bottom:calc(85px + env(safe-area-inset-bottom)); } .navbar { bottom:calc(10px + env(safe-area-inset-bottom)); } }
.save-contact-btn { width:100%; padding:12px; margin-top:12px; border:1px solid #38516D; border-radius:10px; background:#263E64; color:white; font-size:14px; font-weight:500; }
.saved-contacts { margin-top:15px; }
.saved-contacts select { cursor:pointer; }
.contact-navigation { display:flex; gap:8px; margin-top:8px; }
.contact-navigation button { flex:1; padding:10px; background:#15283D; border:1px solid #38516D; border-radius:8px; color:white; font-size:13px; }
/* Custom toggle */
.custom-details-section { width:100%; margin:16px 0; }
.custom-details-row { display:flex; justify-content:space-between; align-items:center; color:white; font-size:16px; padding:10px 0; }
.custom-switch { position:relative; display:inline-block; width:52px; height:31px; flex-shrink:0; }
.custom-switch input { opacity:0; width:0; height:0; }
.custom-switch-slider { position:absolute; inset:0; background:#8E8E93; border-radius:31px; cursor:pointer; transition:background .25s ease; }
.custom-switch-slider::before { content:""; position:absolute; width:27px; height:27px; left:2px; bottom:2px; background:white; border-radius:50%; transition:transform .25s ease; }
.custom-switch input:checked + .custom-switch-slider { background:#34C759; }
.custom-switch input:checked + .custom-switch-slider::before { transform:translateX(21px); }
#customDetailsInput { margin-top:12px; }
.custom-details-hint { font-size:12px; color:#8291A8; margin-top:4px; }
/* Confirmation: original */
.panel:has(.confirmation-screen) { inset:0; height:100%; padding:0; overflow:hidden; background:#09141F; z-index:10; }
.confirmation-screen { position:relative; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#09141F; color:white; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
.confirmation-green { position:absolute; top:0; left:0; width:100%; height:444px; overflow:hidden; touch-action:none; }
.confirmation-green svg.green-shape { position:absolute; inset:0; width:100%; height:100%; }
.confirmation-particles { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; pointer-events:none; z-index:1; }
.idle-particle { position:absolute; width:var(--size); height:var(--size); background:white; border-radius:50%; opacity:0; box-shadow:0 0 6px rgba(255,255,255,.9),0 0 14px rgba(255,255,255,.5); pointer-events:none; animation:randomIdleParticle var(--duration) linear forwards; }
@keyframes randomIdleParticle { 0% { transform:translate(0,0) scale(.5); opacity:0; } 12%,75% { opacity:var(--brightness); } 100% { transform:translate(var(--moveX),var(--moveY)) scale(1.3); opacity:0; } }
.confirmation-check { position:absolute; top:170px; left:50%; transform:translateX(-50%); width:90px; height:90px; z-index:2; }
.confirmation-message { position:absolute; top:275px; left:0; width:100%; text-align:center; font-size:25px; font-weight:400; z-index:2; }
.confirmation-date { position:absolute; top:454px; width:100%; text-align:center; font-size:16px; font-weight:400; color:#8291A8; }
.confirmation-card { position:absolute; top:497px; left:4%; width:92%; height:155px; padding:10px 12px; background:#1A2638; border:1px solid #30425D; border-radius:17px; color:white; }
.confirmation-name { position:relative; top:-3px; font-family:'Nunito Sans',sans-serif; font-size:23px; font-weight:500; margin-top:10px; line-height:1.3; }
.confirmation-phone { font-size:17px; color:#8291A8; margin-top:5px; }
.confirmation-amount { font-family:'Nunito Sans',sans-serif; font-size:40px; font-weight:600; margin-top:20px; line-height:1.1; }
.confirmation-dots { position:absolute; top:calc(50% - 20px); transform:translateY(-50%); right:12px; font-size:20px; font-weight:800; }
.confirmation-footer { position:absolute; bottom:5px; left:0; width:100%; height:58px; display:flex; align-items:center; justify-content:center; }
.confirmation-brand { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; }
.confirmation-logo { display:block; width:115px; height:auto; object-fit:contain; }
.confirmation-close { position:absolute; right:16px; top:50%; transform:translateY(-50%); width:58px; height:58px; min-width:58px; min-height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0; margin:0; font-size:36px; font-weight:400; line-height:1; background:#243F63; color:#7EBEE2; border:1px solid #30425D; cursor:pointer; }
.click-particle-layer { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; pointer-events:none; z-index:9999; }
.click-particle {
    position: absolute;

    width: var(--size);
    height: var(--size);

    background: white;
    border-radius: 50%;

    /* Only one glow instead of three */
    box-shadow: 0 0 5px rgba(255,255,255,.7);

    pointer-events: none;

    will-change: transform, opacity;

    animation: clickParticleFly var(--duration) ease-out forwards;
}
@keyframes clickParticleFly { 0% { transform:translate(-50%,-50%) scale(1); opacity:1; } 100% { transform:translate(calc(-50% + var(--moveX)),calc(-50% + var(--moveY))) scale(0); opacity:0; } }
/* Custom confirmation: separate style, original untouched */
.custom-mode .confirmation-green { height:44%; }
.custom-mode .confirmation-check { top:39%; width:90px; height:90px; transform:translate(-50%,-50%); }
.custom-mode .confirmation-message { top:68%; font-size:25px; }
.custom-mode .confirmation-date { top:46%; font-size:16px; }
.custom-mode .confirmation-card { top:51%; height:22%; min-height:165px; padding:14px 16px; border-radius:17px; }
.custom-mode .confirmation-name { font-family:'Nunito Sans',sans-serif; font-size:23px; font-weight:600; margin-top:0; }
.confirmation-extra { font-family:'Nunito Sans',sans-serif; font-size:16px; font-weight:500; color:white; margin-top:3px; overflow-wrap:anywhere; }
.custom-mode .confirmation-phone { font-size:17px; color:#8291A8; margin-top:4px; }
.custom-mode .confirmation-amount { font-family:'Nunito Sans',sans-serif; font-size:40px; font-weight:600; margin-top:18px; }
.custom-mode .confirmation-dots { top:50%; transform:translateY(-50%); }
.confirmation-reference { position:absolute; bottom:125px; left:5%; width:90%; min-height:52px; display:flex; justify-content:space-between; align-items:center; gap:12px; border-top:1px solid #263E64; border-bottom:1px solid #263E64; font-size:14px; }
.confirmation-reference-label { color:#8291A8; }
.confirmation-reference-value { color:white; text-align:right; font-size:13px; }
.custom-mode .confirmation-demo-label { position:absolute; bottom:100px; left:0; width:100%; color:#8291A8; font-size:11px; text-align:center; }
.custom-mode .confirmation-footer { bottom:5px; }
/* SECRET SOUND PAD */

.confirmation-soundpad {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    z-index: 5;
}
/* INDIVIDUAL BOXES */
.sound-box {
    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    border: none;
    outline: none;
    box-shadow: none;

    color: transparent;
    font-size: 0 ;

    padding: 0;
    margin: 0;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.sound-box:active {
    background: transparent;
}
/* PRESS EFFECT */
.sound-box:active {
background: rgba(255, 255, 255, 0.12);
}
/* iPHONE PERFORMANCE OPTIMIZATION */

.confirmation-particles,
.click-particle-layer {
    contain: layout paint;
    pointer-events: none;
}

.idle-particle,
.click-particle {
    backface-visibility: hidden;
    will-change: transform, opacity;
}

.confirmation-soundpad {
    touch-action: manipulation;
}

.sound-box {
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
}
</style>
</head>
<body>
<audio id="paymentSound" src="./payment.mp3" preload="auto"></audio>
<audio id="paymentSlideSound" src="./paymentslide.mp3" preload="auto" loop></audio>
<div class="screen">
<img class="home-logo" id="logo" src="./Mylogo.jpg" alt="Logo">
<main class="panel" id="panel" hidden aria-live="polite"></main>
<div class="actions" id="actions">
<button class="action" onclick="showPage('swish')">swish</button>
<button class="action scan" onclick="showPage('scan')">Scan <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9V3h6M15 3h6v6M3 15v6h6M21 15v6h-6M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h2m2 0v3m-4 0h2"/></svg></button>
</div>
<nav class="navbar" aria-label="Main navigation">
<button class="tab active" data-page="home" onclick="showPage('home')"><svg class="home-icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
<button class="tab" data-page="together" onclick="showPage('together')"><svg viewBox="0 0 24 24"><path d="M20.5 5.5a5.5 5.5 0 0 0-8.5 0 5.5 5.5 0 0 0-8.5 0c-2.2 2.8-1.4 6.2 1 8.6L12 21l7.5-6.9c2.4-2.4 3.2-5.8 1-8.6Z"/><path d="m8 13 3-3 3 3 3-3"/></svg><span>Together</span></button>
<button class="tab" data-page="history" onclick="showPage('history')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg><span>History</span></button>
<button class="tab" data-page="profile" onclick="showPage('profile')"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></svg><span>Profile</span></button>
</nav>
</div>
<script>
const panel = document.getElementById('panel');
const logo = document.getElementById('logo');
const actions = document.getElementById('actions');
const pages = {
swishscreen: `
<div class="confirmation-screen">
  <div class="confirmation-green">
    <svg class="green-shape" viewBox="0 0 390 430" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="greenGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#91B900"/><stop offset="100%" stop-color="#198A29"/></linearGradient></defs>
      <path d="M 0 0 H 390 V 399 Q 195 449 0 399 Z" fill="url(#greenGradient)"/>
    </svg>
    <div class="confirmation-particles"></div>
    <!-- 3x3 SOUND PAD FÖR SWISH PLINGEN -->
<!-- INVISIBLE SOUND PAD -->
<div class="confirmation-soundpad">

    <button class="sound-box" onclick="pressSoundBox(1)" aria-label="Sound 1"></button>
    <button class="sound-box" onclick="pressSoundBox(2)" aria-label="Sound 2"></button>
    <button class="sound-box" onclick="pressSoundBox(3)" aria-label="Sound 3"></button>

    <button class="sound-box" onclick="pressSoundBox(4)" aria-label="Sound 4"></button>
    <button class="sound-box" onclick="pressSoundBox(5)" aria-label="Sound 5"></button>
    <button class="sound-box" onclick="pressSoundBox(6)" aria-label="Sound 6"></button>

    <button class="sound-box" onclick="pressSoundBox(7)" aria-label="Sound 7"></button>
    <button class="sound-box" onclick="pressSoundBox(8)" aria-label="Sound 8"></button>
    <button class="sound-box" onclick="pressSoundBox(9)" aria-label="Sound 9"></button>

</div>
    <svg class="confirmation-check" viewBox="0 0 64 64" fill="none"><circle cx="30" cy="34" r="25" stroke="white" stroke-opacity=".5" stroke-width="3"/><path d="M18 33 L27 42 L57 12" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="confirmation-message">Your payment has been sent!</div>
  </div>
  <div class="confirmation-date" id="swishDateTime"></div>
  <div class="confirmation-card">
    <div class="confirmation-name" id="swishRecipient"></div>
    <div class="confirmation-phone" id="swishPhone"></div>
    <div class="confirmation-amount" id="swishAmount"></div>
    <div class="confirmation-dots">...</div>
  </div>
  <div class="confirmation-footer">
    <div class="confirmation-brand"><img src="./swishscreen.png" class="confirmation-logo" alt="Swish"></div>
    <button class="confirmation-close" onclick="showPage('home')" aria-label="Close">×</button>
  </div>
  <div class="click-particle-layer" id="clickParticleLayer"></div>
</div>`,
together: `<h1>Together</h1><div class="tile"><h2>Shared space</h2><p>Your shared activities will appear here.</p><button class="primary" onclick="demoNotice()">Create a shared space</button></div>`,
history: `<h1>History</h1><div class="tile"><h2>No activity yet</h2><p>This demo has no transaction history.</p></div>`,
profile: `<h1>Profile</h1><div class="tile"><h2>Demo profile</h2><p>Customize your app experience.</p><label>Display name<input class="field" id="displayname" placeholder="Your name" maxlength="40"></label><button class="primary" onclick="saveName()">Save name</button><p id="savedname"></p></div>`,
swish: `
<button class="back" onclick="showPage('home')">← Back</button>
<h1>swish</h1>
<div class="tile">
<h2>Demo payment</h2><p>No money will be sent.</p>
<label>Recipient<input class="field" id="recipient" placeholder="Name"></label>
<label>Phone number<input class="field" id="phoneNumber" type="tel" placeholder="070 123 45 67"></label>
<button class="save-contact-btn" onclick="saveContact()">+ Save Contact</button>
<div class="saved-contacts"><select id="contactSelector" class="field" onchange="selectSavedContact()"><option value="">Select a saved contact...</option></select><div class="contact-navigation"><button onclick="browseContacts(-1)">‹ Previous</button><button onclick="browseContacts(1)">Next ›</button></div></div>
<div class="custom-details-section">
 <div class="custom-details-row"><span>Custom Details</span><label class="custom-switch"><input type="checkbox" id="customDetailsToggle" onchange="toggleCustomDetails()"><span class="custom-switch-slider"></span></label></div>
 <div id="customDetailsInput" style="display:none"><label>Additional recipient text<input class="field" id="customDetailsText" type="text" placeholder="Example: VALLENTUNA KOMMUN" autocomplete="off"></label><p class="custom-details-hint">In custom mode, phone numbers are displayed exactly as entered.</p></div>
</div>
<label>Amount (SEK)<input class="field" id="amount" type="number" min="0" step="0.01" placeholder="0.00"></label>
<button class="primary" onclick="goToSwishScreen()">next</button>
</div>`,
scan: `<button class="back" onclick="showPage('home')">← Back</button><h1>Scan</h1><div class="scanframe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9V3h6M15 3h6v6M3 15v6h6M21 15v6h-6M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h2m2 0v3m-4 0h2"/></svg></div><p style="text-align:center">QR scanning is a visual demo only.</p>`
};
function showPage(page) {
 const home = page === 'home';
 logo.hidden = !home; actions.hidden = !home; panel.hidden = home;
 if (!home) { panel.innerHTML = pages[page] || ''; if (page === 'swish') loadSavedContacts(); }
 document.querySelectorAll('.tab').forEach(tab => { const active = tab.dataset.page === page; tab.classList.toggle('active',active); tab.setAttribute('aria-current',active ? 'page' : 'false'); });
}
function demoNotice() { alert('Transaktion nekad. Inte tillräckligt saldo på kontot.'); }
function saveName() { const name=document.getElementById('displayname').value.trim(); document.getElementById('savedname').textContent=name ? 'Saved for this preview: '+name : 'Please enter a name.'; }
function toggleCustomDetails() { const toggle=document.getElementById('customDetailsToggle'); const box=document.getElementById('customDetailsInput'); if(toggle&&box) box.style.display=toggle.checked?'block':'none'; }
function formatSwedishPhone(phone) {
 let digits=String(phone).replace(/\D/g,'');
 if(digits.startsWith('46')) digits='0'+digits.slice(2);
 if(/^07\d{8}$/.test(digits)) return '+46 '+digits.slice(1,3)+' '+digits.slice(3,6)+' '+digits.slice(6,8)+' '+digits.slice(8,10);
 return phone;
}
function goToSwishScreen() {
 const recipient=document.getElementById('recipient')?.value || '';
 const phone=document.getElementById('phoneNumber')?.value || '';
 const amount=document.getElementById('amount')?.value || '';
 const customEnabled=document.getElementById('customDetailsToggle')?.checked || false;
 const customText=document.getElementById('customDetailsText')?.value || '';
 const paymentSound=document.getElementById('paymentSound');
 if(paymentSound) { paymentSound.pause(); paymentSound.currentTime=0; paymentSound.volume=1; paymentSound.play().catch(error=>console.log('Sound error:',error)); }
 showPage('swishscreen');
 const screen=document.querySelector('.confirmation-screen');
 document.getElementById('swishRecipient').textContent=recipient;
 document.getElementById('swishPhone').textContent=customEnabled ? phone : formatSwedishPhone(phone);
 document.getElementById('swishAmount').textContent=Number(amount.replace(',','.')).toLocaleString('sv-SE',{minimumFractionDigits:0,maximumFractionDigits:2})+' kr';
 if(customEnabled) {
   screen.classList.add('custom-mode');
   if(customText.trim()) { const extra=document.createElement('div'); extra.className='confirmation-extra'; extra.textContent=customText; document.getElementById('swishPhone').before(extra); }
   const reference=document.createElement('div'); reference.className='confirmation-reference';
   const label=document.createElement('span'); label.className='confirmation-reference-label'; label.textContent='Reference';
   const value=document.createElement('span'); value.className='confirmation-reference-value'; value.textContent='1834 8495 7759 7162';
   reference.append(label,value);
   const footer=screen.querySelector('.confirmation-footer'); footer.before(reference);
 }
 updateSwishDateTime(); startIdleParticles();
}
function updateSwishDateTime() {
 const display=document.getElementById('swishDateTime'); if(!display)return;
 const now=new Date(); const date=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); const time=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}); display.textContent=date+' at '+time;
}
setInterval(updateSwishDateTime,1000);
function getSavedContacts() { try { const contacts=JSON.parse(localStorage.getItem('swishContacts')||'[]'); return Array.isArray(contacts)?contacts:[]; } catch { return []; } }
function saveContact() {
 const name=document.getElementById('recipient').value.trim(), phone=document.getElementById('phoneNumber').value.trim();
 if(!name||!phone) { alert('Please enter a name and phone number first.'); return; }
 const contacts=getSavedContacts(), existing=contacts.findIndex(contact=>contact.phone===phone);
 if(existing!==-1) contacts[existing].name=name; else contacts.push({name,phone});
 try { localStorage.setItem('swishContacts',JSON.stringify(contacts)); } catch { alert('Could not save the contact in this browser.'); return; }
 loadSavedContacts(phone); alert('Contact saved!');
}
function loadSavedContacts(selectedPhone='') {
 const selector=document.getElementById('contactSelector'); if(!selector)return;
 selector.replaceChildren(new Option('Select a saved contact...',''));
 getSavedContacts().forEach(contact=>selector.add(new Option(contact.name+' ('+contact.phone+')',contact.phone)));
 selector.value=selectedPhone;
}
function selectSavedContact() {
 const selector=document.getElementById('contactSelector'); if(!selector)return;
 const contact=getSavedContacts().find(item=>item.phone===selector.value); if(!contact)return;
 document.getElementById('recipient').value=contact.name; document.getElementById('phoneNumber').value=contact.phone;
}
function browseContacts(direction) {
 const contacts=getSavedContacts(); if(!contacts.length) { alert('You have no saved contacts yet.'); return; }
 const selector=document.getElementById('contactSelector'); let index=contacts.findIndex(contact=>contact.phone===selector.value);
 if(index===-1) index=direction===1?0:contacts.length-1; else index=(index+direction+contacts.length)%contacts.length;
 selector.value=contacts[index].phone; selectSavedContact();
}
let particleHoldInterval=null, particlePointerPosition=null, slideSoundTimer=null;
function createClickParticles(clientX,clientY,amount=18) {
 const layer=document.getElementById('clickParticleLayer'); if(!layer)return;
 const rect=layer.getBoundingClientRect(), x=clientX-rect.left, y=clientY-rect.top;
 const dateElement=document.getElementById('swishDateTime'); if(dateElement&&clientY>=dateElement.getBoundingClientRect().top)return;
 for(let i=0;i<amount;i++) {
  const particle=document.createElement('span'); particle.className='click-particle';
  const angle=Math.random()*Math.PI*2, distance=25+Math.random()*95;
  const moveX=Math.cos(angle)*distance, moveY=Math.sin(angle)*distance;
  particle.style.left=x+'px'; particle.style.top=y+'px';
  particle.style.setProperty('--moveX',moveX+'px'); particle.style.setProperty('--moveY',moveY+'px');
  particle.style.setProperty('--size',(4+Math.random()*6)+'px'); particle.style.setProperty('--duration',(650+Math.random()*850)+'ms');
  layer.appendChild(particle); particle.addEventListener('animationend',()=>particle.remove(),{once:true});
 }
}
function startParticleHold(event) {
 if(particleHoldInterval!==null)return; if(event.pointerType==='mouse'&&event.button!==0)return;
 const sound=document.getElementById('paymentSlideSound');
 if(sound) { sound.pause(); sound.currentTime=0; sound.volume=0; sound.play().catch(error=>console.log('Slide sound error:',error)); clearTimeout(slideSoundTimer); slideSoundTimer=setTimeout(()=>{ if(particleHoldInterval!==null)sound.volume=1; },250); }
 particlePointerPosition={x:event.clientX,y:event.clientY}; createClickParticles(event.clientX,event.clientY,8);
particleHoldInterval=setInterval(()=>{
    if(particlePointerPosition) {
        createClickParticles(
            particlePointerPosition.x,
            particlePointerPosition.y,
            3
        );
    }
},120);
}
function moveParticleHold(event) { if(particleHoldInterval!==null)particlePointerPosition={x:event.clientX,y:event.clientY}; }
function stopParticleHold() {
 if(particleHoldInterval!==null) { clearInterval(particleHoldInterval); particleHoldInterval=null; }
 particlePointerPosition=null; clearTimeout(slideSoundTimer); slideSoundTimer=null;
 const sound=document.getElementById('paymentSlideSound'); if(sound) { sound.pause(); sound.currentTime=0; }
}
document.addEventListener('pointerdown',event=>{ if(event.target.closest('.confirmation-green'))startParticleHold(event); });
document.addEventListener('pointermove',moveParticleHold);
document.addEventListener('pointerup',stopParticleHold);
document.addEventListener('pointercancel',stopParticleHold);
window.addEventListener('blur',stopParticleHold);
let idleParticleInterval=null;
function createIdleParticle() {
 const container=document.querySelector('.confirmation-particles'); if(!container)return;
 const particle=document.createElement('span'); particle.className='idle-particle';
 const angle=Math.random()*Math.PI*2, distance=30+Math.random()*140;
 particle.style.left=Math.random()*container.clientWidth+'px'; particle.style.top=Math.random()*container.clientHeight+'px';
 particle.style.setProperty('--size',(3+Math.random()*6)+'px');
 particle.style.setProperty('--moveX',Math.cos(angle)*distance+'px'); particle.style.setProperty('--moveY',Math.sin(angle)*distance+'px');
 particle.style.setProperty('--duration',(2500+Math.random()*5500)+'ms'); particle.style.setProperty('--brightness',.35+Math.random()*.6);
 container.appendChild(particle); particle.addEventListener('animationend',()=>particle.remove(),{once:true});
}
function startIdleParticles() {
 clearInterval(idleParticleInterval); const container=document.querySelector('.confirmation-particles'); if(!container)return;
 container.replaceChildren(); for(let i=0;i<12;i++)createIdleParticle();
idleParticleInterval=setInterval(()=>{
    if(!document.querySelector('.confirmation-particles')) {
        clearInterval(idleParticleInterval);
        idleParticleInterval=null;
        return;
    }

    createIdleParticle();

},450);
}
// PRELOAD ALL NINE SOUNDS
const swishSounds = Array.from({ length: 9 }, (_, i) => {
    const audio = new Audio('./swishpling' + (i + 1) + '.mp3');
    audio.preload = 'auto';
    audio.load();
    return audio;
});

// PLAY SOUND WITHOUT CREATING A NEW AUDIO OBJECT
function pressSoundBox(number) {
    const sound = swishSounds[number - 1];

    if (!sound) return;

    sound.pause();
    sound.currentTime = 0;

    sound.play().catch(error => {
        console.log('Sound error:', error);
    });
}
</script>
