<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#09141F">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Mobile App</title>

<style>

/* Swishscreen */

.my-container {

    position: absolute;

    /* POSITION */

    top: 100px;

    left: 5%;

    width: 90%;

    height: 520px;

    background: linear-gradient(

        145deg,

        #09141F 100%

    );

    border-radius: 0;

    clip-path: shape(

        from 0 0,

        line to 100% 0,

        line to 100% 65%,

        quad to 0 65% via 50% 135%,

        close

);

}

.swishscreen {

    position: relative;

    width: 100%;

    min-height: 100%;

    background: #09141F !important;

}

.swishscreen h1 {

    font-size: 28px;

    font-weight: 600;

    text-align: center;

    margin-top: 30px;

}

.swishscreen p {

    font-size: 16px;

    text-align: center;

    color: white;

}

/* GLOBAL */

:root {

    --bg: #0B131E;

    --white: #E8F1FA;

    --blue: #0077D2;

    --muted: #263E64;

}

* {

    box-sizing: border-box;

}

html, body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    background-color: var(--bg);

    color: var(--white);

    font-family: -apple-system, BlinkMacSystemFont,

    "Segoe UI", sans-serif;

}

button, input {

    font: inherit;

}

button {

    cursor: pointer;

}

/* IPHONE 14 SKÄRMEN SÅ DEN FÅR PLATS PÅ JOPPES LUR */

.screen {

    position: relative;

    width: 100%;

    max-width: 390px;

    height: 100vh;

    height: 100dvh;

    margin: auto;

    overflow: hidden;

    background-color: #0B131E;

}

/* CENTER LOGO */

.home-logo {

    position: absolute;

    width: 200px;

    max-width: 70%;

    height: auto;

    left: 50%;

    top: 44.5%;

    transform: translate(-50%, -50%);

    /* Preserve original JPEG colours */

    mix-blend-mode: normal;

    opacity: 10;

    filter: none;

    object-fit: contain;

}

/* MAIN BUTTONS */

.actions {

    position: absolute;

    bottom: calc(96px + env(safe-area-inset-bottom));

    left: 20px;

    right: 20px;

    display: flex;

    gap: 8px;

}

.action {

    border: none;

    border-radius: 12px;

    height: 55px;

    flex: 1;

    color: white;

    font-size: 19px;

    background: #0077D2;

}

.action.scan {

    background: #263E64;

    color: #84D5FF;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 14px;

}

.action svg {

    width: 26px;

    height: 26px;

}

/* BOTTOM NAVIGATION */

.navbar {

    position: absolute;

    bottom: calc(17px + env(safe-area-inset-bottom));

    left: 20px;

    right: 20px;

    border: 1px solid #2B4057;

    background: #101B27;

    border-radius: 40px;

    height: 62px;

    display: flex;

    padding: 3px;

    box-shadow: 0 0 0 1px #152536;

}

.tab {

    color: var(--white);

    border: none;

    background: none;

    flex: 1;

    min-width: 0;

    border-radius: 38px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 2px;

    font-size: 11px;

}

.tab.active {

    background: #303B46;

}

.tab svg {

    width: 25px;

    height: 25px;

    stroke: currentColor;

    stroke-width: 2;

    fill: none;

    stroke-linecap: round;

    stroke-linejoin: round;

}

.tab.active svg.home-icon {

    fill: currentColor;

}

.tab span {

    white-space: nowrap;

}

/* OTHER PAGES */

.panel {

    position: absolute;

    inset: 0 0 calc(178px + env(safe-area-inset-bottom));

    padding: calc(65px + env(safe-area-inset-top)) 25px 16px;

    overflow: auto;

    background: var(--bg);

}

.panel[hidden],

.home-logo[hidden],

.actions[hidden] {

    display: none;

}

.panel h1 {

    font-size: 27px;

    margin: 0 0 12px;

}

.panel p {

    color: #9BB0C6;

    line-height: 1.5;

}

.tile {

    background: #15283D;

    padding: 18px;

    border-radius: 16px;

    margin: 16px 0;

}

.tile h2 {

    font-size: 18px;

    margin: 0 0 10px;

}

.field {

    width: 100%;

    border: 1px solid #38516D;

    border-radius: 10px;

    background: #0D1D2C;

    color: white;

    padding: 13px;

    margin: 7px 0;

}

.primary {

    border: none;

    background: var(--blue);

    color: white;

    border-radius: 10px;

    padding: 13px 18px;

    width: 100%;

    margin-top: 12px;

}

.back {

    background: none;

    border: none;

    color: #87D0FF;

    padding: 0 0 20px;

}

.scanframe {

    width: 180px;

    height: 180px;

    border: 3px solid #87D0FF;

    border-radius: 20px;

    margin: 35px auto;

    display: grid;

    place-items: center;

    color: #87D0FF;

}

.scanframe svg {

    width: 75px;

    height: 75px;

}

/* SMALLER SCREENS */

@media(max-height: 650px) {

    .home-logo {

        width: 1500px;

    }

    .actions {

        bottom: calc(85px + env(safe-area-inset-bottom));

    }

    .navbar {

        bottom: calc(10px + env(safe-area-inset-bottom));

    }

}

/* SECOND SWISHSCREEN CONTAINER */

.swish2-screen .my-container2 {

 position: absolute;

 top: 450px;

 left: 5%;

 width: 90%;

 height: 150px;

 background: #263E64;

 border-radius: 20px;

 z-index: 5;

}

/* PAYMENT DETAILS INSIDE SECOND CONTAINER */

.my-container2 .payment-info {

    position: absolute;

    inset: 0;

    padding: 12px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

    color: white;

    z-index: 1;

    overflow-wrap: anywhere;

}

.payment-name { font-size: 21px; font-weight: 800; line-height: 1.2; }

.payment-phone { font-size: 13px; font-weight: 600; opacity: .8; margin-top: 4px; }

.payment-amount { font-size: 27px; font-weight: 800; margin-top: 8px; }

.payment-datetime { font-size: 11px; font-weight: 600; opacity: .8; margin-top: 8px; }

/* PAYMENT CONFIRMATION SCREEN */

.panel:has(.confirmation-screen) {
    inset: 0;
    height: 100%;
    padding: 0;
    overflow: hidden;
    background: #09141F;
    z-index: 10;
}

.confirmation-screen {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    background: #09141F;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Arial, sans-serif;
}

/* GREEN CURVED HEADER */

.confirmation-green {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 430px;
    overflow: hidden;
}

.confirmation-green svg.green-shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* TOP BANKID TEXT */

.confirmation-top {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    left: 8px;
    font-size: 10px;
    font-weight: 600;
    color: white;
    z-index: 2;
}

/* WHITE FLOATING PARTICLES */


/* ANIMATED FLOATING PARTICLES */

/* MORE AND BIGGER IDLE PARTICLES */
/* RANDOM IDLE PARTICLES */

.confirmation-particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.idle-particle {
    position: absolute;

    width: var(--size);
    height: var(--size);

    background: white;
    border-radius: 50%;

    opacity: 0;

    box-shadow:
        0 0 6px rgba(255,255,255,.9),
        0 0 14px rgba(255,255,255,.5);

    pointer-events: none;

    animation: randomIdleParticle var(--duration) linear forwards;
}

@keyframes randomIdleParticle {
    0% {
        transform: translate(0, 0) scale(.5);
        opacity: 0;
    }

    12% {
        opacity: var(--brightness);
    }

    75% {
        opacity: var(--brightness);
    }

    100% {
        transform:
            translate(
                var(--moveX),
                var(--moveY)
            )
            scale(1.3);

        opacity: 0;
    }
}

/* CHECKMARK */

.confirmation-check {
    position: absolute;
    top: 170px;
    left: 50%;
    transform: translateX(-50%);
    width: 62px;
    height: 62px;
    z-index: 2;
}

.confirmation-message {
    position: absolute;
    top: 245px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 17px;
    font-weight: 400;
    z-index: 2;
}

/* DATE BELOW GREEN HEADER */

.confirmation-date {
    position: absolute;
    top: 436px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    font-weight: 400;
    color: #8291A8;
}

/* PAYMENT CARD */

.confirmation-card {
    position: absolute;
    top: 463px;
    left: 4%;
    width: 92%;
    min-height: 108px;
    padding: 12px;
    background: #1A2638;
    border: 1px solid #30425D;
    border-radius: 12px;
    color: white;
}

.confirmation-name {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
}

.confirmation-phone {
    font-size: 12px;
    color: #8291A8;
    margin-top: 5px;
}

.confirmation-amount {
    font-size: 28px;
    font-weight: 700;
    margin-top: 11px;
    line-height: 1.1;
}

.confirmation-dots {
    position: absolute;
    right: 13px;
    top: 42px;
    font-size: 20px;
    font-weight: 700;
}

/* BOTTOM SWISH LOGO AND CLOSE BUTTON */

.confirmation-footer {
    position: absolute;
    bottom: calc(25px + env(safe-area-inset-bottom));
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.confirmation-brand {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 19px;
    font-weight: 800;
    color: white;
}

.confirmation-brand-mark {
    font-size: 23px;
    line-height: 1;
}

.confirmation-close {
    position: absolute;
    right: 9px;
    bottom: -4px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid #345A86;
    background: #20416B;
    color: #80D4FF;
    font-size: 25px;
    font-weight: 300;
    display: grid;
    place-items: center;
}
/* SAVED CONTACTS */

.save-contact-btn {
    width: 100%;
    padding: 12px;
    margin-top: 12px;

    border: 1px solid #38516D;
    border-radius: 10px;

    background: #263E64;
    color: white;

    font-size: 14px;
    font-weight: 500;
}

.saved-contacts {
    margin-top: 15px;
}

.saved-contacts select {
    cursor: pointer;
}

.contact-navigation {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.contact-navigation button {
    flex: 1;
    padding: 10px;

    background: #15283D;
    border: 1px solid #38516D;
    border-radius: 8px;

    color: white;
    font-size: 13px;
}
/* INTERACTIVE PARTICLES */

.confirmation-green {
    touch-action: none;
}

/* INTERACTIVE PARTICLES ABOVE ALL CONTENT */

.click-particle-layer {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    pointer-events: none;

    z-index: 9999;
}

/* BIGGER INTERACTIVE PARTICLES */

.click-particle {
    position: absolute;

    width: var(--size);
    height: var(--size);

    background: white;
    border-radius: 50%;

    box-shadow:
        0 0 7px rgba(255,255,255,1),
        0 0 16px rgba(255,255,255,.7),
        0 0 25px rgba(255,255,255,.3);

    pointer-events: none;

    animation: clickParticleFly var(--duration) ease-out forwards;
}

@keyframes clickParticleFly {
    0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--moveX)),
                calc(-50% + var(--moveY))
            )
            scale(0);

        opacity: 0;
    }
}
</style>

</head>

<body>


<audio id="paymentSound" preload="auto">
    <source src="./payment.mp3" type="audio/mpeg">
</audio>

<audio id="paymentSlideSound" src="./paymentslide.mp3" preload="auto" loop></audio>
<div class="screen">

    <!-- CENTER JPEG LOGO -->

    <img

        class="home-logo"

        id="logo"

        src="Mylogo.jpg"

        alt="Logo"

    >

    <!-- PAGE CONTENT -->

    <main

        class="panel"

        id="panel"

        hidden

        aria-live="polite">

    </main>

    <!-- MAIN BUTTONS -->

    <div class="actions" id="actions">

        <button

            class="action"

            onclick="showPage('swish')">

            swish

        </button>

        <button

            class="action scan"

            onclick="showPage('scan')">

            Scan

            <svg viewBox="0 0 390 430"

                 fill="none"

                 stroke="currentColor"

                 stroke-width="2.5">

                <path d="M3 9V3h6M15 3h6v6M3 15v6h6M21 15v6h-6M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h2m2 0v3m-4 0h2"/>

            </svg>

        </button>

    </div>

    <!-- BOTTOM NAVIGATION -->

    <nav class="navbar" aria-label="Main navigation">

        <!-- HOME -->

        <button

            class="tab active"

            data-page="home"

            onclick="showPage('home')">

            <svg class="home-icon" viewBox="0 0 24 24">

                <path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>

            </svg>

            <span>Home</span>

        </button>

        <!-- TOGETHER -->

        <button

            class="tab"

            data-page="together"

            onclick="showPage('together')">

            <svg viewBox="0 0 24 24">

                <path d="M20.5 5.5a5.5 5.5 0 0 0-8.5 0 5.5 5.5 0 0 0-8.5 0c-2.2 2.8-1.4 6.2 1 8.6L12 21l7.5-6.9c2.4-2.4 3.2-5.8 1-8.6Z"/>

                <path d="m8 13 3-3 3 3 3-3"/>

            </svg>

            <span>Together</span>

        </button>

        <!-- HISTORY -->

        <button

            class="tab"

            data-page="history"

            onclick="showPage('history')">

            <svg viewBox="0 0 24 24">

                <circle cx="12" cy="12" r="9"/>

                <path d="M12 6v6l4 2"/>

            </svg>

            <span>History</span>

        </button>

        <!-- PROFILE -->

        <button

            class="tab"

            data-page="profile"

            onclick="showPage('profile')">

            <svg viewBox="0 0 24 24">

                <circle cx="12" cy="7" r="4"/>

                <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/>

            </svg>

            <span>Profile</span>

        </button>

    </nav>

</div>

<script>

const panel = document.getElementById('panel');

const logo = document.getElementById('logo');

const actions = document.getElementById('actions');

const pages = {


swishscreen: `

    <div class="confirmation-screen">

        <!-- GREEN HEADER -->
        <div class="confirmation-green">

            <svg class="green-shape"
     viewBox="0 0 390 430"
     preserveAspectRatio="none"
     xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="greenGradient"
                        x1="0" y1="0"
                        x2="1" y2="1">
            <stop offset="0%" stop-color="#91B900"/>
            <stop offset="100%" stop-color="#198A29"/>
        </linearGradient>
    </defs>

    <path
        d="M 0 0 H 390 V 395 Q 195 425 0 395 Z"
        fill="url(#greenGradient)"
    />

</svg>

            <!-- RANDOM IDLE PARTICLES -->
            <div class="confirmation-particles"></div>

            <!-- SUCCESS CHECKMARK -->
            <svg class="confirmation-check"
                 viewBox="0 0 64 64"
                 fill="none">

                <circle
                    cx="30" cy="34" r="25"
                    stroke="white"
                    stroke-opacity=".5"
                    stroke-width="3"
                />

                <path
                    d="M18 33 L27 42 L57 12"
                    stroke="white"
                    stroke-width="4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>

            <div class="confirmation-message">
                Your payment has been sent!
            </div>

        </div>

        <!-- LIVE DATE AND TIME -->
        <div class="confirmation-date"
             id="swishDateTime"></div>

        <!-- PAYMENT DETAILS -->
        <div class="confirmation-card">

            <div class="confirmation-name"
                 id="swishRecipient"></div>

            <div class="confirmation-phone"
                 id="swishPhone"></div>

            <div class="confirmation-amount"
                 id="swishAmount"></div>

            <div class="confirmation-dots">...</div>

        </div>

        <!-- FOOTER -->
        <div class="confirmation-footer">

            <div class="confirmation-brand">
                <span class="confirmation-brand-mark">🌈</span>
                <span>swish®</span>
            </div>

            <button class="confirmation-close"
                    onclick="showPage('home')">
                ×
            </button>

        </div>

        <!-- INTERACTIVE PARTICLES ABOVE EVERYTHING -->
        <div class="click-particle-layer"
             id="clickParticleLayer"></div>

    </div>

`,


    together: `

        <h1>Together</h1>

        <div class="tile">

            <h2>Shared space</h2>

            <p>Your shared activities will appear here.</p>

            <button class="primary" onclick="demoNotice()">

                Create a shared space

            </button>

        </div>

    `,

    history: `

        <h1>History</h1>

        <div class="tile">

            <h2>No activity yet</h2>

            <p>This demo has no transaction history.</p>

        </div>

    `,

    profile: `

        <h1>Profile</h1>

        <div class="tile">

            <h2>Demo profile</h2>

            <p>Customize your app experience.</p>

            <label>

                Display name

                <input

                    class="field"

                    id="displayname"

                    placeholder="Your name"

                    maxlength="40">

            </label>

            <button class="primary" onclick="saveName()">

                Save name

            </button>

            <p id="savedname"></p>

        </div>

    `,

    swish: `

        <button class="back" onclick="showPage('home')">

            ← Back

        </button>

        <h1>swish</h1>

        <div class="tile">

            <h2>Demo payment</h2>

            <p>No money will be sent.</p>

            <label>

                Recipient

                <input class="field" id="recipient" placeholder="Name">

            </label>

            <label>

                Phone number

                <input class="field" id="phoneNumber" type="tel" placeholder="070 123 45 67">
            </label>
            <!-- SAVE CONTACT -->
<button class="save-contact-btn" onclick="saveContact()">
    + Save Contact
</button>

<!-- SAVED CONTACTS -->
<div class="saved-contacts">

    <select id="contactSelector"
            class="field"
            onchange="selectSavedContact()">

        <option value="">Select a saved contact...</option>

    </select>

    <div class="contact-navigation">
        <button onclick="browseContacts(-1)">‹ Previous</button>
        <button onclick="browseContacts(1)">Next ›</button>
    </div>

</div>

            <label>

                Amount (SEK)

                <input

                    class="field"

                    id="amount"

                    type="number"

                    min="0"

                    step="0.01"

                    placeholder="0.00">

            </label>

            <button class="primary" onclick="goToSwishScreen()">

                next

            </button>

        </div>

    `,

    scan: `

        <button class="back" onclick="showPage('home')">

            ← Back

        </button>

        <h1>Scan</h1>

        <div class="scanframe">

            <svg viewBox="0 0 24 24"

                 fill="none"

                 stroke="currentColor"

                 stroke-width="1.5">

                <path d="M3 9V3h6M15 3h6v6M3 15v6h6M21 15v6h-6M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h2m2 0v3m-4 0h2"/>

            </svg>
        <!-- PARTICLES ABOVE ALL PAYMENT CONTENT -->
<div class="click-particle-layer" id="clickParticleLayer"></div>

        </div>

        <p style="text-align:center">

            QR scanning is a visual demo only.

        </p>

    `

};

function showPage(page) {

    const home = page === 'home';

    logo.hidden = !home;

    actions.hidden = !home;

    panel.hidden = home;

    if (!home) {
    panel.innerHTML = pages[page] || '';

    if (page === 'swish') {
        loadSavedContacts();
    }
}

    document.querySelectorAll('.tab').forEach(tab => {

        const active = tab.dataset.page === page;

        tab.classList.toggle('active', active);

        tab.setAttribute(

            'aria-current',

            active ? 'page' : 'false'

        );

    });

}

function demoNotice() {

    alert('Transaktion nekad. Inte tillräckligt saldo på kontot.');

}

function saveName() {

    const name = document.getElementById('displayname').value.trim();

    document.getElementById('savedname').textContent =

        name

        ? 'Saved for this preview: ' + name

        : 'Please enter a name.';

}

function goToSwishScreen() {
    // PLAY PAYMENT SOUND
const paymentSound = document.getElementById('paymentSound');

if (paymentSound) {
    paymentSound.pause();
    paymentSound.currentTime = 0;
    paymentSound.volume = 1;


    paymentSound.play().catch(error => {
        alert('Sound error: ' + error.message);
    });
}

    const recipient = document.getElementById('recipient')?.value || '';

    const phone = document.getElementById('phoneNumber')?.value || '';

    const amount = document.getElementById('amount')?.value || '';

    showPage('swishscreen');

    document.getElementById('swishRecipient').textContent = recipient;

    document.getElementById('swishPhone').textContent = phone;

    document.getElementById('swishAmount').textContent = amount.trim() !== '' && Number.isFinite(Number(amount))

        ? Number(amount).toLocaleString('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' kr'

        : '';

    updateSwishDateTime();
    startIdleParticles();

}


function updateSwishDateTime() {

    const display = document.getElementById('swishDateTime');

    if (!display) return;

    const now = new Date();

    const date = now.toLocaleDateString('en-GB', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
    });

    const time = now.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    });

    display.textContent = date + ' at ' + time;
}

setInterval(updateSwishDateTime, 1000);
// LOAD SAVED CONTACTS

function getSavedContacts() {
    try {
        const contacts = JSON.parse(
            localStorage.getItem('swishContacts') || '[]'
        );

        return Array.isArray(contacts) ? contacts : [];
    } catch {
        return [];
    }
}


// SAVE A NEW CONTACT

function saveContact() {

    const name = document.getElementById('recipient').value.trim();
    const phone = document.getElementById('phoneNumber').value.trim();

    if (!name || !phone) {
        alert('Please enter a name and phone number first.');
        return;
    }

    const contacts = getSavedContacts();

    // Prevent saving the same phone number twice
    const existing = contacts.findIndex(
        contact => contact.phone === phone
    );

    if (existing !== -1) {
        contacts[existing].name = name;
    } else {
        contacts.push({ name, phone });
    }

    try {
        localStorage.setItem('swishContacts', JSON.stringify(contacts));
    } catch {
        alert('Could not save the contact in this browser.');
        return;
    }

    loadSavedContacts(phone);

    alert('Contact saved!');
}


// DISPLAY CONTACTS IN THE DROPDOWN

function loadSavedContacts(selectedPhone = '') {

    const selector = document.getElementById('contactSelector');

    if (!selector) return;

    const contacts = getSavedContacts();

    selector.replaceChildren(new Option('Select a saved contact...', ''));

    contacts.forEach(contact => {

        const option = new Option(
            contact.name + ' (' + contact.phone + ')',
            contact.phone
        );

        selector.add(option);
    });

    selector.value = selectedPhone;
}


// SELECT A SAVED CONTACT

function selectSavedContact() {

    const selector = document.getElementById('contactSelector');
    const phone = selector.value;

    const contact = getSavedContacts().find(
        item => item.phone === phone
    );

    if (!contact) return;

    document.getElementById('recipient').value = contact.name;
    document.getElementById('phoneNumber').value = contact.phone;
}


// BROWSE CONTACTS WITH PREVIOUS / NEXT

function browseContacts(direction) {

    const contacts = getSavedContacts();

    if (contacts.length === 0) {
        alert('You have no saved contacts yet.');
        return;
    }

    const selector = document.getElementById('contactSelector');

    let index = contacts.findIndex(
        contact => contact.phone === selector.value
    );

    if (index === -1) {
        index = direction === 1 ? 0 : contacts.length - 1;
    } else {
        index = (index + direction + contacts.length) % contacts.length;
    }

    selector.value = contacts[index].phone;

    selectSavedContact();
}
// INTERACTIVE GREEN SCREEN PARTICLES

let particleHoldInterval = null;
let particlePointerPosition = null;
let slideSoundTimer = null;
let slideSoundPointerId = null;

// BIGGER AND MORE INTERACTIVE PARTICLES

function createClickParticles(clientX, clientY, amount = 18) {

    const layer = document.getElementById('clickParticleLayer');

if (!layer) return;

const rect = layer.getBoundingClientRect();

const x = clientX - rect.left;
const y = clientY - rect.top;

// INVISIBLE PARTICLE BOUNDARY
const dateElement = document.getElementById('swishDateTime');

if (dateElement) {

    const dateRect = dateElement.getBoundingClientRect();

    // Stop creating particles when the pointer
    // reaches or goes below the date and time
    if (clientY >= dateRect.top) {
        return;
    }

}

    for (let i = 0; i < amount; i++) {

        const particle = document.createElement('span');

        particle.className = 'click-particle';

        const angle = Math.random() * Math.PI * 2;

        // Particles travel further
        const distance = 25 + Math.random() * 95;

        const moveX = Math.cos(angle) * distance;
        const moveY = Math.sin(angle) * distance;

        // Bigger particles: 4px to 10px
        const size = 4 + Math.random() * 6;

        // Slightly longer animations
        const duration = 650 + Math.random() * 850;

        particle.style.left = x + 'px';
        particle.style.top = y + 'px';

        particle.style.setProperty('--moveX', moveX + 'px');
        particle.style.setProperty('--moveY', moveY + 'px');
        particle.style.setProperty('--size', size + 'px');
        particle.style.setProperty('--duration', duration + 'ms');

        layer.appendChild(particle);

        particle.addEventListener('animationend', () => {
            particle.remove();
        }, { once: true });
    }
}


// START PARTICLES WHEN PRESSED

function startParticleHold(event) {
    

    if (particleHoldInterval !== null) return;

    if (event.pointerType === 'mouse' && event.button !== 0) return;

    // Start silently during the actual user interaction
const sound = document.getElementById('paymentSlideSound');

if (sound) {
    sound.pause();
    sound.currentTime = 0;
    sound.volume = 0;

    sound.play().catch(error => {
        console.log('Slide sound error:', error);
    });

    // Only make it audible after holding for 250ms
    clearTimeout(slideSoundTimer);

    slideSoundTimer = setTimeout(() => {
        if (particleHoldInterval !== null) {
            sound.volume = 1;
        }
    }, 250);
}
    // Start sound only after holding for 250 milliseconds
slideSoundPointerId = event.pointerId;

clearTimeout(slideSoundTimer);

slideSoundTimer = setTimeout(() => {

    if (particleHoldInterval === null) return;

    const sound = document.getElementById('paymentSlideSound');

    if (!sound) return;

    sound.currentTime = 0;
    sound.volume = 1;

    sound.play().catch(error => {
        console.log('Slide sound error:', error);
    });

}, 250);

    particlePointerPosition = {
        x: event.clientX,
        y: event.clientY
    };

    // Create an immediate burst
    createClickParticles(
        particlePointerPosition.x,
        particlePointerPosition.y,
        25
    );

    // Continue creating particles while holding
    particleHoldInterval = setInterval(() => {

    if (!particlePointerPosition) return;

    createClickParticles(
        particlePointerPosition.x,
        particlePointerPosition.y,
        10
    );

}, 55);
}


// FOLLOW FINGER OR MOUSE

function moveParticleHold(event) {

    if (particleHoldInterval === null) return;

    particlePointerPosition = {
        x: event.clientX,
        y: event.clientY
    };
}


// STOP PARTICLES WHEN RELEASED

function stopParticleHold() {

    // Stop spawning particles
    if (particleHoldInterval !== null) {
        clearInterval(particleHoldInterval);
        particleHoldInterval = null;
    }

    particlePointerPosition = null;

    // Cancel the sound if released before 250ms
    clearTimeout(slideSoundTimer);
    slideSoundTimer = null;
    slideSoundPointerId = null;

    // Stop sound immediately when released
    const sound = document.getElementById('paymentSlideSound');

    if (sound) {
        sound.pause();
        sound.currentTime = 0;
    }
}


// CONNECT EVENTS TO GREEN CONTAINER

document.addEventListener('pointerdown', event => {

    if (!event.target.closest('.confirmation-green')) return;

    startParticleHold(event);
});

document.addEventListener('pointermove', moveParticleHold);

document.addEventListener('pointerup', stopParticleHold);

document.addEventListener('pointercancel', stopParticleHold);

window.addEventListener('blur', stopParticleHold);
// RANDOM IDLE PARTICLE SYSTEM

let idleParticleInterval = null;

function createIdleParticle() {

    const container = document.querySelector('.confirmation-particles');

    if (!container) return;

    const particle = document.createElement('span');

    particle.className = 'idle-particle';

    const width = container.clientWidth;
    const height = container.clientHeight;

    // Random starting position
    const x = Math.random() * width;
    const y = Math.random() * height;

    // Random direction and travel distance
    const angle = Math.random() * Math.PI * 2;
    const distance = 30 + Math.random() * 140;

    const moveX = Math.cos(angle) * distance;
    const moveY = Math.sin(angle) * distance;

    // Random size, speed and brightness
    const size = 3 + Math.random() * 6;
    const duration = 2500 + Math.random() * 5500;
    const brightness = .35 + Math.random() * .6;

    particle.style.left = x + 'px';
    particle.style.top = y + 'px';

    particle.style.setProperty('--size', size + 'px');
    particle.style.setProperty('--moveX', moveX + 'px');
    particle.style.setProperty('--moveY', moveY + 'px');
    particle.style.setProperty('--duration', duration + 'ms');
    particle.style.setProperty('--brightness', brightness);

    container.appendChild(particle);

    particle.addEventListener('animationend', () => {
        particle.remove();
    }, { once: true });
}


// START IDLE PARTICLES

function startIdleParticles() {

    clearInterval(idleParticleInterval);

    const container = document.querySelector('.confirmation-particles');

    if (!container) return;

    container.replaceChildren();

    // Immediately create particles so the screen isn't empty
    for (let i = 0; i < 35; i++) {
        createIdleParticle();
    }

    // Continuously spawn new particles
    idleParticleInterval = setInterval(() => {

        if (!document.querySelector('.confirmation-particles')) {
            clearInterval(idleParticleInterval);
            idleParticleInterval = null;
            return;
        }

        createIdleParticle();
        createIdleParticle();

    }, 180);
}
