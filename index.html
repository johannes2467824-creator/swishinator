
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #09141F;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
        }

        /* CENTER CIRCLE */

        .circle {
            position: fixed;
            top: calc(50% - 60px);
            left: 50%;
            transform: translate(-50%, -50%);

            width: 150px;
            height: 150px;

            background: white;
            border-radius: 50%;
        }

        /* BOTTOM BUTTONS */

        .buttons {
            position: fixed;
            bottom: calc(10px + env(safe-area-inset-bottom));
            left: 0;

            display: flex;
            gap: 12px;

            width: 100%;
            padding: 0 20px;
        }

        button {
            flex: 1;
            height: 52px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        .button1 {
            background: #0077D2;
        }

        .button2 {
            background: #263E64;
        }
    </style>
</head>

<body>

    <div class="circle"></div>

    <div class="buttons">
        <button class="button1"></button>
        <button class="button2"></button>
    </div>

</body>
</html>
